name: Bug report
description: Something in the stack does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. The more of the output below
        you can paste in, the faster this gets fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. Open http://localhost:3000
        3. ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part of the stack
      multiple: true
      options:
        - Go app
        - Prometheus / alert rules
        - Loki / Alloy (logs)
        - Tempo (traces)
        - Grafana (dashboards or datasources)
        - Docker Compose
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: smoke
    attributes:
      label: Output of ./scripts/smoke-test.sh
      description: This pinpoints which component is failing. Paste the whole thing.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Output of: docker version && docker compose version && uname -a"
      render: shell
    validations:
      required: true
